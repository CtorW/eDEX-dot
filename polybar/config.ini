;==========================================================
;
;   Polybar config (Updated with IPC Toggleable Tray - Visible by Default)
;
;==========================================================

[colors]
background = #05080d
foreground = #789296
primary = #aacfd1
alert = #e06c75

;----------------------------------------------------------

[bar/main]
width = 100%
height = 28
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "FiraCode Nerd Font Mono:size=11;2"
font-1 = "FiraCode Nerd Font:style=Regular:size=13;3"
font-2 = "FiraCode Nerd Font:style=Regular:size=16;3"

modules-left = i3 xwindow
modules-right = pulseaudio cpu memory wlan eth date tray-launcher

cursor-click = pointer
cursor-scroll = ns-resize

tray-padding = 2
tray-background = ${colors.background}

;----------------------------------------------------------

[module/tray-launcher]
type = custom/text
content = " 󰣇 "
content-foreground = ${colors.primary}
click-right = ~/.config/polybar/scripts/toggle_stalonetray.sh

;----------------------------------------------------------

[module/i3]
type = internal/i3
index-sort = true
enable-scroll = false
pin-workspaces = true
format = <label-state>
format-separator = " ╱ "
format-separator-foreground = ${colors.foreground}

label-focused = %name%
label-focused-padding = 2
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-suffix = ""
label-focused-suffix-font = 3
label-focused-suffix-background = ${colors.background}
label-focused-suffix-foreground = ${colors.primary}

label-unfocused = %name%
label-unfocused-padding = 2
label-unfocused-background = ${colors.background}
label-unfocused-foreground = ${colors.foreground}

label-urgent = %name%
label-urgent-padding = 2
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-suffix = ""
label-urgent-suffix-font = 3
label-urgent-suffix-background = ${colors.background}
label-urgent-suffix-foreground = ${colors.alert}

;----------------------------------------------------------

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%

;----------------------------------------------------------

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
label-volume =  %percentage%%
label-volume-foreground = ${colors.foreground}
format-muted = <label-muted>
label-muted =  muted
label-muted-foreground = ${colors.foreground}
click-right = pavucontrol

;----------------------------------------------------------

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.foreground}
label = %percentage:2%%

;----------------------------------------------------------

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.foreground}
label = %percentage_used%%

;----------------------------------------------------------

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0
format-connected = <label-connected>
label-connected =  %essid%
label-connected-foreground = ${colors.foreground}
format-disconnected = <label-disconnected>
label-disconnected =  disconnected
label-disconnected-foreground = ${colors.foreground}

;----------------------------------------------------------

[module/eth]
type = internal/network
interface-type = wired
interval = 3.0
format-connected = <label-connected>
label-connected =  connected
label-connected-foreground = ${colors.foreground}
format-disconnected = <label-disconnected>
label-disconnected =  disconnected
label-disconnected-foreground = ${colors.foreground}

;----------------------------------------------------------

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %I:%M
label =  %date%
label-foreground = ${colors.foreground}

;----------------------------------------------------------

[settings]
screenchange-reload = true
pseudo-transparency = false

;==========================================================